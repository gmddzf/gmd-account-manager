name: Build GMD macOS Universal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-universal:
    name: Build GMD macOS Universal DMG
    runs-on: macos-latest
    env:
      VITE_GMD_UPDATER_ENABLED: "true"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sidecars/cockpit-cliproxy/go.mod
          cache-dependency-path: sidecars/cockpit-cliproxy/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Sync package versions
        run: npm run sync-version

      - name: Check Tauri updater signing secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY}" || {
            echo "Missing repository secret TAURI_SIGNING_PRIVATE_KEY" >&2
            exit 1
          }
          test -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}" || {
            echo "Missing repository secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD" >&2
            exit 1
          }

      - name: Build Universal app and updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --ci --target universal-apple-darwin

      - name: Stage GMD release assets
        run: |
          set -euo pipefail
          rm -rf release-assets
          node scripts/release/stage_release_assets.cjs \
            --platform macos \
            --mac-arch universal \
            --assets-dir target/universal-apple-darwin/release/bundle \
            --output-dir release-assets
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          find release-assets -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Upload GMD macOS package
        uses: actions/upload-artifact@v4
        with:
          name: gmd-account-manager-macos-universal-${{ github.run_number }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30
